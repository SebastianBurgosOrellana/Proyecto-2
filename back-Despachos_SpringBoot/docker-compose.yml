version: '3.9'

services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot
      dockerfile: Dockerfile 
    container_name: despachos_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/academia
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot
      dockerfile: Dockerfile
    container_name: ventas_app
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/academia
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  mysql_data: 