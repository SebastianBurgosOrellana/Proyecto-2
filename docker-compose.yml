version: '3.9'

services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend-despachos:
    image: ${AWS_REGISTRY}/innovatech-despachos:latest
    container_name: despachos_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/academia
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  backend-ventas:
    image: ${AWS_REGISTRY}/innovatech-ventas:latest
    container_name: ventas_app
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/academia
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  frontend:
    image: ${AWS_REGISTRY}/innovatech-front:latest
    container_name: frontend_app
    restart: always
    ports:
      - "80:80"
    environment:
      - DESPACHOS_API_URL=http://10.0.2.245:8080
      - VENTAS_API_URL=http://10.0.2.245:8081

volumes:
  mysql_data: