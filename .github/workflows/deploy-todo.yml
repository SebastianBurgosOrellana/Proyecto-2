name: Deploy Full Stack to AWS ECR

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech-front:latest ./front_despacho
          docker push $ECR_REGISTRY/innovatech-front:latest

      - name: Build and Push Backend Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech-despachos:latest ./back-Despachos_SpringBoot
          docker push $ECR_REGISTRY/innovatech-despachos:latest

      - name: Build and Push Backend Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech-ventas:latest ./back-Ventas_SpringBoot
          docker push $ECR_REGISTRY/innovatech-ventas:latest

  deploy-infrastructure:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Frontend to Public EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 35.153.169.212
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Start Frontend Container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 35.153.169.212
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo apt-get update
            sudo apt-get install -y awscli
            cd ~/app
            export AWS_REGISTRY="${{ secrets.AWS_REGISTRY }}"
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $AWS_REGISTRY
            sudo -E docker compose up -d frontend

      - name: Deploy Backend to Private EC2 via Bastion Proxy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 35.153.169.212
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/vockey.pem
            chmod 600 ~/vockey.pem
            scp -o StrictHostKeyChecking=no -i ~/vockey.pem ~/app/docker-compose.yml ubuntu@10.0.2.245:~/docker-compose.yml
            
            ssh -o StrictHostKeyChecking=no -i ~/vockey.pem ubuntu@10.0.2.245 << 'EOF'
              export AWS_REGISTRY="${{ secrets.AWS_REGISTRY }}"
              export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
              export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              export AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
              
              aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $AWS_REGISTRY
              sudo -E docker compose up -d db backend-despachos backend-ventas
            EOF
            rm ~/vockey.pem



            }