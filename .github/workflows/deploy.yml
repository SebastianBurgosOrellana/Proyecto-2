name: CI/CD Pipeline to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v3

    - name: Iniciar sesion en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y subir imagen de Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./front_despacho
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest

    - name: Construir y subir imagen de Backend Despachos
      uses: docker/build-push-action@v4
      with:
        context: ./back-Despachos_SpringBoot
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-despachos:latest

    - name: Construir y subir imagen de Backend Ventas
      uses: docker/build-push-action@v4
      with:
        context: ./back-Ventas_SpringBoot
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-ventas:latest